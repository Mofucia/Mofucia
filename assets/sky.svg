<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="A bright sky full of birds flying above a skyline of tall buildings">
  <defs>
    <!-- Sky gradient that fades in from the top -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecdf7" stop-opacity="0"/>
      <stop offset="0.1" stop-color="#8ecdf7" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#b7e4ff"/>
      <stop offset="1" stop-color="#e3f5ff"/>
    </linearGradient>

    <!-- Soft glow around the sun -->
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3b0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </radialGradient>

    <!-- Repeating window pattern for the foreground buildings -->
    <pattern id="windows" width="36" height="44" patternUnits="userSpaceOnUse">
      <rect width="36" height="44" fill="#31485f"/>
      <rect x="6" y="9" width="11" height="15" rx="2" fill="#ffe9b0"/>
      <rect x="21" y="9" width="11" height="15" rx="2" fill="#ffffff" opacity="0.35"/>
      <rect x="6" y="28" width="11" height="15" rx="2" fill="#ffffff" opacity="0.3"/>
      <rect x="21" y="28" width="11" height="15" rx="2" fill="#ffffff" opacity="0.35"/>
    </pattern>

    <!-- Reusable bird shape -->
    <g id="bird" fill="none" stroke="#1f3145" stroke-width="3.2" stroke-linecap="round">
      <path d="M -15 0 Q -7.5 -9 0 -1.5 Q 7.5 -9 15 0"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="460" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="1010" cy="90" r="88" fill="url(#sunGlow)"/>
  <circle cx="1010" cy="90" r="40" fill="#ffe9a8"/>

  <!-- Clouds -->
  <g fill="#ffffff">
    <g opacity="0.92">
      <ellipse cx="180" cy="132" rx="72" ry="26"/>
      <ellipse cx="232" cy="118" rx="48" ry="30"/>
      <ellipse cx="132" cy="122" rx="40" ry="21"/>
    </g>
    <g opacity="0.9">
      <ellipse cx="600" cy="92" rx="62" ry="22"/>
      <ellipse cx="646" cy="82" rx="44" ry="26"/>
      <ellipse cx="554" cy="84" rx="34" ry="18"/>
    </g>
    <g opacity="0.85">
      <ellipse cx="880" cy="186" rx="56" ry="20"/>
      <ellipse cx="922" cy="176" rx="40" ry="24"/>
      <ellipse cx="842" cy="178" rx="30" ry="16"/>
    </g>
    <g opacity="0.65">
      <ellipse cx="470" cy="300" rx="52" ry="16"/>
      <ellipse cx="505" cy="292" rx="34" ry="20"/>
    </g>
  </g>

  <!-- Distant buildings (hazy background) -->
  <g fill="#9dbed9" opacity="0.75">
    <rect x="0" y="350" width="55" height="110"/>
    <rect x="155" y="295" width="60" height="165"/>
    <rect x="480" y="255" width="95" height="205"/>
    <rect x="585" y="310" width="70" height="150"/>
    <rect x="930" y="290" width="70" height="170"/>
    <rect x="1090" y="340" width="55" height="120"/>
  </g>

  <!-- Tall buildings (foreground skyline at the bottom) -->
  <g>
    <rect x="50" y="240" width="105" height="220" fill="url(#windows)"/>
    <rect x="205" y="315" width="75" height="145" fill="url(#windows)"/>
    <rect x="340" y="165" width="125" height="295" fill="url(#windows)"/>
    <rect x="375" y="130" width="55" height="40" fill="url(#windows)"/>
    <rect x="400" y="95" width="5" height="40" fill="#31485f"/>
    <circle cx="402.5" cy="92" r="5" fill="#ff7b7b"/>
    <rect x="645" y="285" width="95" height="175" fill="url(#windows)"/>
    <rect x="795" y="205" width="130" height="255" fill="url(#windows)"/>
    <rect x="858" y="170" width="4" height="40" fill="#31485f"/>
    <rect x="995" y="255" width="105" height="205" fill="url(#windows)"/>
    <rect x="1135" y="330" width="65" height="130" fill="url(#windows)"/>
  </g>

  <!-- A bunch of birds scattered across the sky -->
  <g>
    <use href="#bird" xlink:href="#bird" transform="translate(110 90) scale(1.15) rotate(-6)"/>
    <use href="#bird" xlink:href="#bird" transform="translate(255 155) scale(0.8) rotate(4)"/>
    <use href="#bird" xlink:href="#bird" transform="translate(335 80) scale(1) rotate(0)"/>
    <use href="#bird" xlink:href="#bird" transform="translate(455 205) scale(0.6) rotate(-8)"/>
    <use href="#bird" xlink:href="#bird" transform="translate(525 125) scale(1.05) rotate(6)"/>
    <use href="#bird" xlink:href="#bird" transform="translate(645 175) scale(0.7) rotate(0)"/>
    <use href="#bird" xlink:href="#bird" transform="translate(710 95) scale(1.3) rotate(-4)"/>
    <use href="#bird" xlink:href="#bird" transform="translate(795 235) scale(0.55) rotate(10)"/>
    <use href="#bird" xlink:href="#bird" transform="translate(865 135) scale(0.9) rotate(0)"/>
    <use href="#bird" xlink:href="#bird" transform="translate(950 205) scale(0.7) rotate(-6)"/>
    <use href="#bird" xlink:href="#bird" transform="translate(1085 165) scale(1) rotate(5)"/>
    <use href="#bird" xlink:href="#bird" transform="translate(1145 255) scale(0.6) rotate(0)"/>
    <use href="#bird" xlink:href="#bird" transform="translate(175 245) scale(0.75) rotate(8)"/>
    <use href="#bird" xlink:href="#bird" transform="translate(560 355) scale(0.5) rotate(-3)"/>
    <use href="#bird" xlink:href="#bird" transform="translate(700 340) scale(0.55) rotate(4)"/>
    <use href="#bird" xlink:href="#bird" transform="translate(300 362) scale(0.45) rotate(0)"/>
  </g>
</svg>
